name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install mcp-test
        run: pip install -e ".[all]"

      - name: Run core tests
        run: pytest tests/ -v

      - name: Run filesystem example tests
        run: pytest examples/filesystem_server/ --mcp-command "python examples/filesystem_server/server.py" -v

      - name: Run weather example tests
        run: pytest examples/weather_server/ --mcp-command "python examples/weather_server/server.py" -v

      - name: Run database example tests
        run: pytest examples/database_server/ --mcp-command "python examples/database_server/server.py" -v

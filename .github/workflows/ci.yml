name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Trim Windows + older-Python combos since this is a pytest plugin
        # used via `python -m pytest`; the OS surface we actually exercise
        # is whatever subprocess'd MCP servers run on.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Run filesystem example (incl. FilesystemServerTests pack)
        run: pytest examples/filesystem_server/ --mcp-command "python examples/filesystem_server/server.py" -v

      - name: Run database example (incl. DatabaseServerTests pack)
        run: pytest examples/database_server/ --mcp-command "python examples/database_server/server.py" -v

      - name: Run api-wrapper example (incl. APIWrapperTests pack)
        run: pytest examples/api_wrapper_server/ -v

      - name: Run shell-exec example (incl. ShellExecTests pack)
        run: pytest examples/shell_exec_server/ --mcp-command "python examples/shell_exec_server/server.py" -v

      - name: Run weather example
        run: pytest examples/weather_server/ --mcp-command "python examples/weather_server/server.py" -v

  plugin-compat:
    name: pytest plugin compat (py${{ matrix.python-version }} + ${{ matrix.plugin || 'baseline' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        plugin: ["", "pytest-asyncio", "pytest-cov", "pytest-xdist"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install -e ".[all]"
          pip install pytest

      - name: Install peer plugin
        if: matrix.plugin != ''
        run: pip install ${{ matrix.plugin }}

      - name: Run tests
        run: pytest tests/ -v --tb=short

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check mcp_test tests
      # Note: format-check is intentionally not enforced repo-wide yet; the
      # codebase predates ruff and a one-shot reformat would generate huge
      # diffs that bury real changes. Add a focused format-check job once we
      # ship a single "ruff format ." reformat commit.

  conformance:
    name: Anthropic MCP conformance suite (demo server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: pip install -e ".[all]" pytest

      - name: Boot demo HTTP server
        run: |
          python -m mcp_test._demo_server_http &
          echo $! > /tmp/demo_pid
          # Wait for the port to come up.
          timeout 30 bash -c 'until curl -sf -X POST http://127.0.0.1:8765/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json,text/event-stream" \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"ci-probe\",\"version\":\"0\"}}}"; \
            do sleep 0.5; done'

      - name: Run upstream MCP conformance suite vs. baseline
        # Anthropic's own action — same one any other SDK uses. If we
        # introduce a regression that isn't already in conformance-baseline.yml
        # this step fails the build.
        uses: modelcontextprotocol/conformance@v0.1.11
        with:
          mode: server
          url: http://127.0.0.1:8765/mcp
          expected-failures: ./conformance-baseline.yml
          suite: active

      - name: Run our offline smoke conformance (parser + heuristics)
        if: always()
        run: |
          mcp-test conformance --url http://127.0.0.1:8765/mcp --offline --json-output > conformance-offline.json || true
          cat conformance-offline.json

      - name: Tear down demo server
        if: always()
        run: kill $(cat /tmp/demo_pid) || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: |
            conformance-offline.json
            results/
          if-no-files-found: ignore

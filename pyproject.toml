[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-test"
version = "0.1.0"
description = "pytest for MCP servers — the testing framework for the Model Context Protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "mcp-test contributors" }]
keywords = ["mcp", "testing", "pytest", "model-context-protocol", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
http = ["httpx>=0.25"]
schema = ["jsonschema>=4.0"]
all = ["mcp-test[http,schema]"]

[project.entry-points."pytest11"]
mcp_test = "mcp_test.plugin"

[project.scripts]
mcp-test = "mcp_test.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
